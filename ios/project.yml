# Unbox for iPhone: a native shell around packetdrop.vercel.app, with things the web app cannot do
# (sign-in sheet, home/lock-screen widgets). Generated into an Xcode project with XcodeGen (see .github/workflows/ios.yml).
name: Unbox
options:
  bundleIdPrefix: com.eliorsasi
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: he
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Unbox:
    type: application
    platform: iOS
    sources: [Unbox]
    dependencies:
      - target: UnboxWidget
    info:
      path: Unbox/Info.plist
      properties:
        CFBundleDisplayName: Unbox
        CFBundleDevelopmentRegion: he
        CFBundleLocalizations: [he]
        UILaunchScreen: {UIColorName: ""}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.eliorsasi.unbox
            CFBundleURLSchemes: [unbox]
    entitlements:
      path: Unbox/Unbox.entitlements
      properties:
        com.apple.security.application-groups: [group.com.eliorsasi.unbox]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eliorsasi.unbox
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  UnboxWidget:
    type: app-extension
    platform: iOS
    sources: [UnboxWidget]
    info:
      path: UnboxWidget/Info.plist
      properties:
        CFBundleDisplayName: Unbox
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: UnboxWidget/UnboxWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.eliorsasi.unbox]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eliorsasi.unbox.widget
        TARGETED_DEVICE_FAMILY: "1"
