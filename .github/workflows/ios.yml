# Builds the iPhone app on a Mac in the cloud on every change under ios/ (no signing yet: it checks that it compiles).
name: iPhone app
on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode project
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Build (simulator, unsigned)
        run: |
          cd ios
          xcodebuild -project Unbox.xcodeproj -scheme Unbox -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build | tail -40
          exit ${PIPESTATUS[0]}
      - name: Run in the simulator and take a screenshot
        run: |
          cd ios
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path '*Debug-iphonesimulator/Unbox.app' -maxdepth 6 | head -1)
          DEV=$(xcrun simctl list devices available | grep -m1 -E 'iPhone 1[5-9]( Pro)? \(' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl launch "$DEV" com.eliorsasi.unbox
          sleep 25
          xcrun simctl io "$DEV" screenshot launch.png
          sips -Z 500 -s format jpeg launch.png --out small.jpg >/dev/null; echo SHOT_BEGIN; base64 -i small.jpg; echo SHOT_END
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: ios/launch.png
      - name: Build for iPhone (installed with Sideloadly, which signs it)
        run: |
          cd ios
          xcodebuild -project Unbox.xcodeproj -scheme Unbox -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | tail -5
          APP=build/Build/Products/Release-iphoneos/Unbox.app
          # Ad-hoc signature that carries the app-group entitlement, so Sideloadly keeps it when it signs.
          codesign -f -s - --entitlements UnboxWidget/UnboxWidget.entitlements "$APP/PlugIns/UnboxWidget.appex"
          codesign -f -s - --entitlements Unbox/Unbox.entitlements "$APP"
          mkdir -p Payload && cp -R "$APP" Payload/ && zip -qry Unbox.ipa Payload && ls -la Unbox.ipa
      - name: Publish the .ipa
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "ios-build-${{ github.run_number }}" ios/Unbox.ipa --title "Unbox for iPhone, build ${{ github.run_number }}" --notes "Install with Sideloadly." --latest=false
